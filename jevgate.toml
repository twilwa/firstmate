# The request cap was removed because Jev is cheap.
provider = "openrouter"
model = "typesafe/jev-latest"
fail_on = ["none"]

# Keep common credentials and private key material out of review uploads.
upload_deny = [
  "**/.env*",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "**/id_rsa*",
  "**/*.credentials",
]
