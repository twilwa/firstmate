# JevGate uses OpenRouter's Jev route and keeps all findings advisory while we calibrate.
provider = "openrouter"
model = "typesafe/jev-latest"
max_requests = 10
fail_on = ["none"]

# Keep common credentials and private key material out of review uploads.
upload_deny = [
  "**/.env*",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "**/id_rsa*",
  "**/*.credentials",
]
