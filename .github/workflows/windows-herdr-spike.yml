name: Portable pool isolation proof spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-4:
    name: Four-worker portable pool proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for the proof candidates
        run: |
          set -eu
          command -v tmux >/dev/null || { echo "::error::tmux is required"; exit 1; }
          tmux -V
      - name: Install tasks-axi
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Install the Pi package for the Pi extension tests
        run: |
          set -eu
          npm install -g @earendil-works/pi-coding-agent
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
      - name: Start resource sampler
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-proof-4"
          nohup bash -c '
            out=$1
            printf "epoch\tload1\tcpu_busy_pct\trss_kib_total\n" > "$out"
            prev_total=
            prev_busy=
            while :; do
              epoch=$(date +%s)
              l1=$(cut -d" " -f1 /proc/loadavg)
              read -r tag user nice system idle iowait irq softirq steal rest < /proc/stat
              total=$((user + nice + system + idle + iowait + irq + softirq + steal))
              busy=$((total - idle - iowait))
              pct=0
              if [ -n "$prev_total" ]; then
                dt=$((total - prev_total))
                db=$((busy - prev_busy))
                [ "$dt" -gt 0 ] && pct=$((db * 100 / dt))
              fi
              rss=$(ps -eo rss= | awk "{s+=\$1} END{print s}")
              printf "%s\t%s\t%s\t%s\n" "$epoch" "$l1" "$pct" "$rss" >> "$out"
              prev_total=$total
              prev_busy=$busy
              sleep 5
            done
          ' _ "$RUNNER_TEMP/fm-proof-4/resources.tsv" >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/fm-proof-4/sampler.pid"
      - name: Run four-worker isolation proof
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-proof-4"
          bash --version | head -1
          bin/fm-test-isolation-proof.sh --jobs 4 --json "$RUNNER_TEMP/fm-proof-4/isolation-proof.json"
      - name: Stop sampler and summarize resources
        if: always()
        run: |
          set -eu
          if [ -f "$RUNNER_TEMP/fm-proof-4/sampler.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/fm-proof-4/sampler.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/fm-proof-4/resources.tsv" ]; then
            awk -F'\t' 'NR > 1 { if ($4 > maxrss) maxrss = $4; if ($3 > maxcpu) maxcpu = $3; cpu += $3; if ($2 > maxload) maxload = $2; n++ }
              END { printf "samples=%d peak_rss_kib=%d peak_cpu_busy_pct=%d mean_cpu_busy_pct=%d peak_load1=%s\n", n, maxrss, maxcpu, (n ? cpu / n : 0), maxload }' \
              "$RUNNER_TEMP/fm-proof-4/resources.tsv" | tee "$RUNNER_TEMP/fm-proof-4/resource-summary.txt"
          fi
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-isolation-proof-jobs4
          path: |
            ${{ runner.temp }}/fm-proof-4/isolation-proof.json
            ${{ runner.temp }}/fm-proof-4/resources.tsv
            ${{ runner.temp }}/fm-proof-4/resource-summary.txt
          if-no-files-found: warn

